# FundHub VM login portal (2FA). Secrets are NOT here: /etc/authelia/secrets/* via authelia/override.conf.
theme: auto
server:
  address: 'tcp://127.0.0.1:9091/authelia'
log:
  level: info
totp:
  issuer: 'FundHub VM'
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /etc/authelia/users.yml
    password:
      algorithm: argon2
access_control:
  default_policy: deny
  rules:
    # The Drive: any VM user (2FA).
    - domain: '@DOMAIN@'
      resources: ['^/drive([/?].*)?$']
      policy: two_factor
    # Everything else (code-server = a root shell on the VM): only the "admins" group (2FA).
    - domain: '@DOMAIN@'
      subject: 'group:admins'
      policy: two_factor
session:
  expiration: 12h
  inactivity: 2h
  remember_me: -1
  cookies:
    - domain: '@DOMAIN@'
      authelia_url: 'https://@DOMAIN@/authelia'
      default_redirection_url: 'https://@DOMAIN@/'
regulation:
  max_retries: 3
  find_time: 5m
  ban_time: 30m
storage:
  local:
    path: /var/lib/authelia/db.sqlite3
notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
