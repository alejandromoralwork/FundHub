# FundHub engine — sized for a 4 GB VM shared with code-server
listen_addresses = 'localhost'
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
# Engine workers + capture server + Metabase + admin console instances on Vercel (each with a small pool).
max_connections = 100
wal_compression = on
max_wal_size = 2GB
random_page_cost = 1.1
