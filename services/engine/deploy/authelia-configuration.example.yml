# FundHub VM login portal (2FA) — copy kept in services/engine/deploy/authelia-configuration.example.yml (secrets removed)
theme: auto
server:
  address: 'tcp://127.0.0.1:9091/authelia'
log:
  level: info
totp:
  issuer: 'FundHub VM'
identity_validation:
  reset_password:
    jwt_secret: '<generated: openssl rand -hex 32>'
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /etc/authelia/users.yml
    password:
      algorithm: argon2
access_control:
  default_policy: deny
  rules:
    - domain: 'alejandro-code.centralindia.cloudapp.azure.com'
      policy: two_factor
session:
  secret: '<generated: openssl rand -hex 32>'
  expiration: 12h
  inactivity: 2h
  remember_me: -1
  cookies:
    - domain: 'alejandro-code.centralindia.cloudapp.azure.com'
      authelia_url: 'https://alejandro-code.centralindia.cloudapp.azure.com/authelia'
      default_redirection_url: 'https://alejandro-code.centralindia.cloudapp.azure.com/'
regulation:
  max_retries: 3
  find_time: 5m
  ban_time: 30m
storage:
  encryption_key: '<generated: openssl rand -hex 32>'
  local:
    path: /var/lib/authelia/db.sqlite3
notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
